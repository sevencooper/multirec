[package]
name = "multirec"
version = "0.2.0"
edition = "2021"
description = "Multi-device synchronized audio recorder for Windows with live stats and speaker transcripts"
license = "MIT"
readme = "README.md"

[features]
default = ["whisper"]
# Local speech-to-text via whisper.cpp (needs CMake + LLVM/libclang at build time).
whisper = ["dep:whisper-rs"]
# GPU acceleration for transcription (needs the Vulkan SDK at build time).
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]

[dependencies]
eframe = "=0.29.1"
hound = "3.5"
claxon = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
anyhow = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rfd = "0.15"
global-hotkey = "0.6"
ureq = "2"
opus = "0.4"
ogg = "0.9"
whisper-rs = { version = "0.16", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# DSP-heavy tests are unbearably slow unoptimized.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
