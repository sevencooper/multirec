# Build + test on Windows for every push/PR. Pushing a tag like v0.2.0 also
# publishes a GitHub Release with multirec.exe attached.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tags

jobs:
  windows:
    runs-on: windows-latest
    env:
      # whisper-rs uses bindgen, which needs libclang (LLVM is preinstalled on the runner).
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: multirec-windows-x64
          path: target/release/multirec.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/multirec.exe
          generate_release_notes: true
