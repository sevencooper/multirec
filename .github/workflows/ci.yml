# Build + test on Windows for every push/PR. Pushing a tag like v0.2.0 also
# publishes a GitHub Release with multirec.exe attached.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tags

jobs:
  windows:
    runs-on: windows-latest
    env:
      # whisper-rs uses bindgen, which needs libclang (LLVM is preinstalled on the runner).
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Bump when C/C++ build flags change: whisper-rs-sys doesn't rebuild on env changes.
          prefix-key: v2-portable-ggml
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Guard against CPU-specific code
        # The exe must run on any x86-64 CPU with AVX2. AVX-512 (zmm registers) in
        # ggml crashed v0.1.0/v0.2.0 on most consumer CPUs. A few dozen zmm uses are
        # fine: they come from the C runtime's CPU-dispatched memcpy/memset.
        shell: pwsh
        run: |
          $n = (& "C:\Program Files\LLVM\bin\llvm-objdump.exe" -d --no-show-raw-insn target/release/multirec.exe | Select-String -SimpleMatch "zmm").Count
          Write-Host "zmm instructions: $n"
          if ($n -gt 200) { throw "Found $n AVX-512 instructions: build is not portable" }
      - uses: actions/upload-artifact@v7
        with:
          name: multirec-windows-x64
          path: target/release/multirec.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/multirec.exe
          generate_release_notes: true
